name: Deploy Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy OpenNext app to Cloudflare Workers
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build OpenNext app
        run: npx opennextjs-cloudflare build

      - name: Upload Supabase URL secret
        run: printf "%s" "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL

      - name: Upload Supabase service role secret
        run: printf "%s" "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy
