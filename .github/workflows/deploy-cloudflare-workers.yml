name: Deploy Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy OpenNext app to Cloudflare Workers
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create minimal bootstrap Worker
        run: |
          cat > worker-bootstrap.js <<'EOF'
          export default {
            async fetch() {
              return new Response('JU FinAnt Cloudflare bootstrap is active.');
            }
          };
          EOF

          cat > wrangler.bootstrap.jsonc <<'EOF'
          {
            "name": "ju-finant-club-website",
            "main": "worker-bootstrap.js",
            "compatibility_date": "2025-04-01",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"]
          }
          EOF

          npx wrangler deploy --config wrangler.bootstrap.jsonc

      - name: Upload Supabase URL secret
        run: printf "%s" "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL

      - name: Upload Supabase service role secret
        run: printf "%s" "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Build OpenNext app
        run: npx opennextjs-cloudflare build

      - name: Deploy OpenNext Worker with runtime secrets
        run: npx opennextjs-cloudflare deploy
